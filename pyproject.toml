[project]
name = "invoice-extract-vlm"
version = "0.1.0"
description = "VLM-based invoice/receipt field extraction: dataset pipeline, canonical schema, baseline eval harness."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Jayani" }]

dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "rapidfuzz>=3.9",
    "typer>=0.12",
    "Pillow>=10.3",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # Phase 3: TfidfRetriever is the default retriever and imports
    # sklearn unguarded, so this is core, not optional.
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "black>=24.4",
    "pre-commit>=3.7",
]
ocr = [
    # Phase 1: preprocessing + OCR. opencv/scikit-image do the image work;
    # pytesseract and paddleocr are thin wrappers over engines that must also
    # be installed at system level (see docs/phase1_preprocessing.md).
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
    "PyMuPDF>=1.24",
]
rag = [
    # Phase 3's complete retrieve-augment-generate path: a sentence encoder for
    # dense retrieval and a small instruction-tuned LLM for the generation
    # step. Both run on CPU. The TF-IDF retriever and the weighted-vote
    # categoriser are core and need none of this -- these are the dense and
    # generated variants the plan called for, kept optional because they pull
    # torch.
    "torch>=2.3",
    "transformers>=4.42",
]
demo = [
    # Phase 2.5: the Streamlit walkthrough in demo/app.py. Needed to show the
    # demo, not to compute anything -- the cache builder runs without it.
    "streamlit>=1.35",
]
datasets = [
    # scripts/convert_fatura2.py and scripts/convert_sroie_hf.py both read
    # Hugging Face parquet mirrors.
    "pyarrow>=16.0",
    "huggingface-hub>=0.23",
]
paddle = [
    "paddleocr>=2.7",
    "paddlepaddle>=2.6",
]
vlm = [
    # Heavy deps needed only for actual model inference (Colab/Kaggle), not for
    # schema/dataset/eval work. Kept optional so the core repo installs fast.
    "torch>=2.3",
    "transformers>=4.42",
    "accelerate>=0.31",
    "bitsandbytes>=0.43",
    "qwen-vl-utils>=0.0.2",
]

[project.scripts]
ie-validate-schema = "invoice_extract.data.validate:main"
ie-eval = "invoice_extract.eval.harness:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_extract"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Notebooks target Colab, not this package: different Python, different
# installed deps, and their sources are JSON-escaped so ruff misparses the
# regex literals inside them.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
# `slow` marks tests that run real OCR (~40 s/page on CPU). Skip them with
# `pytest -m "not slow"` while iterating.
markers = [
    "slow: needs a real OCR engine and takes tens of seconds per document",
]
